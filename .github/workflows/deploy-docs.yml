name: Validate & Deploy API Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Overlay drift check (text-overrides.yaml must be applied)
        run: |
          pip install --quiet pyyaml
          python3 spec/apply_text_overrides.py
          git diff --exit-code docs/openapi.json || {
            echo '::error::docs/openapi.json is out of sync with spec/text-overrides.yaml.'
            echo '::error::Run: python3 spec/apply_text_overrides.py  and commit both files.'
            exit 1
          }

      - name: Validate OpenAPI spec
        run: npx --yes @apidevtools/swagger-cli@4 validate docs/openapi.json

      - name: Changelog / breaking changes vs previous commit
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git show HEAD~1:docs/openapi.json > /tmp/prev.json 2>/dev/null || exit 0
          docker run --rm -v /tmp:/tmp -v $PWD:/work tufin/oasdiff:latest \
            changelog /tmp/prev.json /work/docs/openapi.json || true

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
