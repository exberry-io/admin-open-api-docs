      | 102 | Missing position account |
      | `(NEW v1.56.0)`  <br>113 | Not supported |
      | 10001 | Permission denied |
  Trade_Cancellation:
    summary: Trade Cancellation
    description: |-
      Trade Cancellation API allows you to cancel a trade

      #### Trade Cancellation- Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | System is unavailable |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 101 | \[FieldName\] not found |
      | 102 | Currently not allowed |
      | 102 | Instrument trading is not allowed |
      | 105 | Cancelation failed, trade is already canceled or from previous days or is leg trade |
      | 10001 | Permission denied |
  Trade_Adjustment:
    summary: Trade Adjustment
    description: |-
      Trade Adjustment allows to change the price of a trade

      #### Trade Adjustment- Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | System is unavailable |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 101 | \[FieldName\] not found |
      | 102 | Currently not allowed |
      | 102 | Instrument trading is not allowed |
      | 102 | Trading is not allowed during auction call |
      | 102 | Trading is not allowed during crossing |
      | 102 | Price precision is\[PricePrecision\] |
      | 102 | Quantity precision is\[QuantityPrecision\] |
      | 102 | Instrument trading is halted |
      | 102 | Price breaches \[FieldName\] of \[FieldValue\] |
      | 102 | Maximum value is \[maxOrderValue\] |
      | 102 | Price tick size is \[tickSize\] |
      | 102 | Trading is not allowed |
      | 102 | Request failed, strategy leg configuration has changed |
      | 105 | Request failed, trade is already canceled or from previous days or is leg trade |
      | 105 | Implied order trades can’t be adjusted |
      | 111 | Not allowed when LEDGER is enabled |
      | 10001 | Permission denied |
  Apply_Cash_Distribution:
    summary: Apply Cash Distribution
    description: |-
      Apply Cash Distribution API allows you to adjust active orders and current market data fields(not historical) in case of a Corporate Actions that results cash distributions (such as cash dividend).

      #### Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | System is unavailable |
      | 10001 | Permission denied |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 100 | \[FieldName\] must be ≤ \[maxLong/10^ fieldPrecision\] |
      | 100 | \[FieldName\] must be ≥ \[minLong/10^ fieldPrecision\] |
      | 102 | Instrument trading is not allowed |
      | 102 | Trading is not allowed during auction call |
      | 102 | Trading is not allowed during crossing |
      | 102 | Instrument should be halted when market is open |
      | 102 | Apply Cash Distribution is not allowed when there is no Closing Price |
  Apply_Security_Distribution:
    summary: Apply Security Distribution
    description: |-
      Apply Security Distribution API allows you to adjust active orders and current market data fields(not historical) in case of a Corporate Actions that results security distributions (such as stock dividend).

      #### **Response:**

      Same as Apply Cash Distribution

      #### Error Codes

      Same as Apply Cash Distribution with below exceptions

      | Code | Message |
      | --- | --- |
      | 102 | Apply Cash Distribution is not allowed when there is no Closing Price  <br>  <br>Not applicable to Apply Security Distribution |
  Get_Candle_Adjustments:
    summary: Get Candle Adjustments
    description: |-
      Get Candle Adjustments API allows you to retrieve the historical market data adjustment factors related to Corporate Actions at instrument level.

      #### Error Codes

      Same as Update Candle Adjustments
  Update_Candle_Adjustments:
    summary: Update Candle Adjustments
    description: |-
      Update Candle Adjustments API allows you to create/update the historical market data adjustment factors related to Corporate Actions at instrument level.

      #### **Response:**

      No response body

      #### Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | System is unavailable |
      | 10001 | Permission denied |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 101 | \[FieldName\] must be ≤ \[maxLong/10^ fieldPrecision\] |
  Delete_Candle_Adjustments:
    summary: Delete Candle Adjustments
    description: |-
      Delete Candle Adjustments API allows you to delete the historical market data adjustment factors related to Corporate Actions at instrument level.

      #### **Response:**

      No response body

      #### Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | System is unavailable |
      | 10001 | Permission denied |
      | 100 | Missing or invalid parameter: \[FieldName\] |
  Set_Settlement_Price:
    summary: Set Settlement Price
    description: |-
      Set Settlement Price API allows you to set settlement price for an instrument

      #### Set Settlement Prices - Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | Exchange is unavailable |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 101 | instrumentId not found |
      | 102 | Currently not allowed |
      | 10001 | Permission denied |
  Set_Tick_Reference_Price:
    summary: Set Tick Reference Price
    description: |-
      Set Tick Reference Price API allows you to set Tick Reference Price for an instrument

      #### Tick Reference Price - Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | Exchange is unavailable |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 101 | instrumentId not found |
      | 10001 | Permission denied |
  Trading_Halt:
    summary: Trading Halt
    description: |-
      Trading Halt API allows you to halt the trading for a:

      - List of instrument

      - List of instrument groups

      - All instruments

      - Multiple filtered instruments, see [here](https://documenter.getpostman.com/view/6229811/TzCV3jcq#c1b23770-4cc1-41b0-a035-15f3e280bbe4) for more details


      #### Schedule Halt and Resume CHANGED 1.57.0

      1. When the request sets a halt, it is allowed to specify halt at explicit time as well as the explicit resumption time. If not defind, action is immediate. When scheduling resume, a time gap extension instead of an explicit time can be defined.

      2. Examples:

          1. Now it's 14:00 and a user clicks on halt with a time interval of 10 minutes, trading will resume at 14:10.

          2. In addition to the previous example, at 14:07 the user again clicks on halt with a time interval of 5 minutes, trading will resume at 14:15 (14:10 plus the 5 minutes from the latest request).


      **Behavior Summary**

      1. Scheduled Resume can be triggered by one of the below:

          1. CBR: Triggered by CBR

          2. Regular: Triggered by operator (via time interval or explicit time)


      | New Request | Existing Timers | Behavior |
      | --- | --- | --- |
      | Halt Without Scheduled Resume  <br>  <br>OR  <br>Halt & Scheduled Resume With Explicit Time  <br>  <br>OR  <br>Immediate Resume  <br>  <br>OR  <br>Scheduled Halt  <br>  <br>OR  <br>Scheduled Halt & Scheduled Resume | Scheduled Halt  <br>with/ without any Scheduled Resume  <br>  <br>OR  <br>Scheduled Resume | Drop existing schedule and apply the new command |
      | Halt & Scheduled Resume with Time Interval | Scheduled Resume Regular | Interval of the new request will be added to the original Scheduled Resume time. |
      | Halt & Scheduled Resume with Time Interval | Scheduled CBR Resume  <br>OR  <br>Scheduled Halt  <br>with/ without any Scheduled Resume | Drop existing schedule and apply the new command |
      | CBR Halt with/without Resume | Scheduled Halt  <br>with/ without Scheduled Resume  <br>OR  <br>Scheduled Resume | Doesn’t drop existing scheduled halts/resumes and halts immediately and schedule new resume (if applicable) |

      #### Trading Halt - Error Codes

      | Code | Message |
      | --- | --- |
      | 2001 | Wrong action |
      | 2001 | Wrong instrumentIds |
      | 2002 | \[FieldName\] must be in future |
      | 2003 | Only one of scheduleResumeTime and scheduleResumeTimeInterval is allowed |
      | 2401 | Wrong instrumentId: \[instrumentId\] |
      | 2401 | Wrong instrumentGroupIds: \[instrumentGroupId\] |
      | 403 | Permission denied |
      | 201 | You can send up to 750 instruments per request |
  Trading_Resume:
    summary: Trading Resume
    description: |-
      Trading Resume API allows you to resume the trading for a:

      - List of instrument

      - List of instrument groups

      - All instruments

      - Multiple filtered instruments, see [here](https://documenter.getpostman.com/view/6229811/TzCV3jcq#c1b23770-4cc1-41b0-a035-15f3e280bbe4) for more details


      #### Trading Resume - Error Codes

      | Code | Message |
      | --- | --- |
      | 2001 | Wrong action |
      | 2001 | Wrong instrumentIds |
      | 2001 | Wrong \[FieldName\] |
      | 2401 | Wrong instrumentId: \[instrumentId\] |
      | 2401 | Wrong instrumentGroupIds: \[instrumentGroupId\] |
      | 403 | Permission denied |
      | 201 | You can send up to 750 instruments per request |
  Set_News:
    summary: Set News
    description: |-
      New v1.50.0

      Set News API allows you to submit news to the system

      #### Set News - Error Codes

      | Code | Message |
      | --- | --- |
      | 1 | Exchange is unavailable |
      | 100 | Missing or invalid parameter: \[FieldName\] |
      | 10001 | Permission denied |
